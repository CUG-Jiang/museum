<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>预览</title>
    <script type="text/javascript"
        src="https://api.tianditu.gov.cn/api?v=4.0&tk=11f9d483473bdab76998c972141796f9"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        #app,
        html,
        body {
            padding: 0;
            margin: 0;
            background: #eeeeee;
        }

        img,
        div {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .el-tooltip__popper.is-dark {
            background: rgba(0, 0, 0, 0.5);
        }

        .el-tooltip__popper[x-placement^=top] .popper__arrow {
            border-top-color: rgba(0, 0, 0, 0.5);
        }

        .el-tooltip__popper[x-placement^=top] .popper__arrow::after {
            border-top-color: rgba(0, 0, 0, 0.5);
        }

        .el-image-viewer__mask {
            opacity: 0.8;
        }

        *::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        *::-webkit-scrollbar-button {
            width: 0;
            height: 0;
        }

        *::-webkit-scrollbar-thumb {
            background-color: transparent;
            border-radius: 2px;
        }

        *:hover::-webkit-scrollbar-thumb {
            background-color: #BBC1C4;
        }

        #pano {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
        }

        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9;
        }

        .mark {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            pointer-events: none;
            z-index: 0;
        }

        .mobile_mark {
            font-size: 10px;
        }

        .advertisement {
            width: 50%;
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
        }

        .mobile {
            width: 70%;
        }

        .advertisement-img {
            width: 100%;
            cursor: pointer;
        }

        .advertisement-close {
            width: 20px;
            position: absolute;
            top: -8px;
            right: -8px;
            cursor: pointer;
        }

        .advertisement-hint {
            position: absolute;
            bottom: 5px;
            right: 0;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            padding: 0 5px;
        }
    </style>
</head>

<body>
    <script src="index.js"></script>

    <div id="app">
        <div id="pano"></div>
    </div>
    <script>
        async function checkNetworkStatus() {
            try {
                const response = await fetch('https://api.tianditu.gov.cn/api?v=4.0&tk=11f9d483473bdab76998c972141796f9', {
                    method: 'HEAD',
                    mode: 'no-cors',
                    cache: 'no-cache'
                });
                return true;
            } catch (error) {
                return false;
            }
        }
        var data = null;
        window.jydata = data
        window.onload = function () {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'project.json', true);
            xhr.onload = async function (res) {
                data = xhr.responseText
                window.jydata = JSON.parse(data)
                const isOnline = await checkNetworkStatus()
                if (!isOnline) {
                    window.jydata.open.openingAnimation = window.jydata.open.openingAnimation == 5 ? 0 : window.jydata.open.openingAnimation;
                    window.jydata.sandTable.map = window.jydata.sandTable.map?.filter(item => item.type != 3)
                }
                var xhr2 = new XMLHttpRequest();
                xhr2.open('GET', 'panorama.json', true);
                xhr2.onload = function (res2) {
                    var data2 = xhr2.responseText
                    window.jydata.panoramaList = JSON.parse(data2)

                    window.hideImplant = true;
                    window.hideHotspot = true;

                    window.JyCom()
                    setTimeout(() => {
                        embedpano({
                            xml: window.jydata.xml, bgcolor: window.jydata.base.icon.moduleList[5].defaultColor, target: "pano", html5: "only", mobilescale: 1.0,
                            onready: function (jsapi) {
                                window.krpano = jsapi.get("global");
                                window.krpano.actions.includexml('plugins/jy-config/config.xml', function () {
                                    window.implantInterval = []
                                    window.implantIntervalLook = []
                                    window.krpano.call("add_shade()")
                                    if (!window.krpano.device.mobile) {
                                        window.krpano.call("draghotspot()")
                                        window.krpano.call("add_mouse_pos()")
                                    }
                                    window.krpano.call("showFlootHotspot()")
                                    window.ScreenDigitalHuman.init()
                                })
                            }
                        });
                    }, 500);
                }
                xhr2.send(null);
            };
            xhr.send(null);
        }
    </script>
</body>

</html>
